<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/feed"></ion-back-button>
    </ion-buttons>
    <ion-title>Ajustes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="settings-container">

    <!-- Avatar section -->
    <div class="avatar-section">
      <div class="avatar-wrapper">
        <ion-avatar class="profile-avatar">
          <img *ngIf="preview" [src]="preview" />
          <img *ngIf="!preview" src="https://placehold.co/120x120?text=Perfil" />
        </ion-avatar>
        <div class="avatar-overlay" (click)="fileInput.click()">
          <ion-icon name="camera-outline"></ion-icon>
        </div>
      </div>
      <input type="file" #fileInput (change)="onFileChange($event)" accept="image/*" hidden />
      <div class="avatar-actions">
        <ion-button fill="outline" shape="round" size="small" (click)="fileInput.click()" class="avatar-btn">
          Subir Archivo
        </ion-button>
        <ion-button fill="outline" shape="round" size="small" (click)="takePhoto()" class="avatar-btn">
          Tomar Foto
        </ion-button>
      </div>
    </div>

    <!-- Form -->
    <div class="form-section">
      <div class="form-group">
        <ion-input
          fill="outline"
          label="Nombre"
          labelPlacement="floating"
          [(ngModel)]="name"
          type="text"
          class="settings-input">
        </ion-input>
      </div>

      <div class="form-group">
        <ion-input
          fill="outline"
          label="Correo electrónico"
          labelPlacement="floating"
          [(ngModel)]="email"
          type="email"
          class="settings-input">
        </ion-input>
      </div>

      <div class="form-group">
        <ion-input
          fill="outline"
          label="Nueva contraseña"
          labelPlacement="floating"
          [(ngModel)]="password"
          type="password"
          placeholder="Dejar en blanco para no cambiar"
          class="settings-input">
        </ion-input>
      </div>

      <ion-button expand="block" shape="round" (click)="save()" class="save-btn">
        Guardar Cambios
      </ion-button>
    </div>

  </div>
</ion-content>
